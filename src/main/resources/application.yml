spring:
  application:
    name: impact-board
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/impactboard}
    username: ${DATABASE_USER:impactboard}
    password: ${DATABASE_PASSWORD:impactboard}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
server:
  port: ${PORT:8081}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
app:
  upload-dir: ${UPLOAD_DIR:uploads}
